backend: pytorch
tensor_parallel_size: 4
moe_expert_parallel_size: 1
enable_attention_dp: false

max_batch_size: 128
# Note: When MTP is enabled and `cuda_graph_batch_sizes` is specified, `max_num_tokens` must satisfy the following formula:
# max_num_tokens >= max(cuda_graph_batch_sizes) * (num_nextn_predict_layers + 1)
# This is a known issue in TensorRT-LLM and will be resolved in the next release.
max_num_tokens: 1024
max_seq_len: 32768
kv_cache_config:
  enable_block_reuse: false
  free_gpu_memory_fraction: 0.85
  dtype: auto

enable_chunked_prefill: true
 
cuda_graph_config:
  enable_padding: true
  batch_sizes:
  - 1
  - 2
  - 3
  - 4
  - 6
  - 8
  - 12
  - 16
  - 24
  - 32
  - 48
  - 64
  - 96
  - 128

print_iter_log: false

scheduler_config:
  capacity_scheduler_policy: MAX_UTILIZATION